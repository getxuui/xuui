<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('xuui-theme') !== 'light',
        );
      } catch {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/xuui.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/xuui-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="A local workbench for exploring UI together."
    />
    <title>Card exploration · xuui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
